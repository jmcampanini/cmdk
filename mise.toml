min_version = "2026.1.0"

[settings]
lockfile = true
lockfile_platforms = ["linux-x64", "macos-arm64"]

[tools]
go = "1.27.3"
golangci-lint = "2.14.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.6.0"
# tmux is a runtime dependency of cmdk and of its unit and end-to-end tests. Pinning it here gives local and CI runs the same tmux; users still install tmux with their platform package manager.
tmux = "3.7c"

# node is pinned only to run markdownlint-cli2 for the lint-markdown task.
node = "24.21.0"
"npm:markdownlint-cli2" = "0.24.0"

[env]
# Go's default GOTOOLCHAIN=auto lets it download and run whatever toolchain go.mod asks for. local pins execution to the Go that mise installed, so mise.toml is the only place the toolchain version is decided.
GOTOOLCHAIN = "local"

[tasks.build]
description = "Build build/cmdk with git-derived version metadata."
run = '''
version="$(git describe --tags --dirty --always 2>/dev/null || printf 'unknown')"
mkdir -p build
go build -trimpath -buildvcs=false -ldflags "-X github.com/jmcampanini/cmdk/internal/cli.Version=${version}" -o build/cmdk .
'''

# Shared by test and test-unit; hidden so it does not show up as a target.
[tasks.unit-tests]
hide = true
wait_for = ["test-unit-guard"]
run = '''
packages="$(go list ./...)" || exit $?
packages="$(printf '%s\n' "$packages" | grep -v '/e2e$')"
if [ -z "$packages" ]; then echo "no unit test packages found" >&2; exit 1; fi
go test -count=1 -race $packages
'''

[tasks.test]
description = "Run all unit and required end-to-end tests uncached with the race detector."
depends = ["unit-tests", "test-e2e"]

[tasks.test-unit]
description = "Run unit tests uncached with the race detector, without end-to-end tests."
depends = ["test-unit-guard", "unit-tests"]

[tasks.test-unit-guard]
hide = true
run = '''
echo "CMDK_E2E_STATUS=OPTED_OUT"
if [ -n "${CI:-}" ]; then echo "required CI rejects the end-to-end opt-out" >&2; exit 1; fi
'''

# The suite drives build/cmdk, so test-e2e depends on build and tells the suite where the binary is instead of letting it build for itself.
[tasks.test-e2e]
description = "Run required tmux end-to-end tests and validate their completion markers."
depends = ["build"]
env = { CMDK_E2E_BINARY = "{{config_root}}/build/cmdk" }
run = '''
mkdir -p .sandbox
output=".sandbox/test-e2e.$$.log"
trap 'rm -f "$output"' EXIT HUP INT TERM
test_rc=0
go test -count=1 -race -v ./internal/e2e >"$output" 2>&1 || test_rc=$?
cat_rc=0
cat "$output" || cat_rc=$?
validation_rc=0
if [ $cat_rc -ne 0 ]; then
  echo "failed to read e2e test output" >&2
  validation_rc=1
fi
if ! grep -Fq 'CMDK_E2E_TMUX_SENTINEL=PASS' "$output"; then
  echo "missing CMDK_E2E_TMUX_SENTINEL=PASS in e2e test output" >&2
  validation_rc=1
fi
if ! grep -Fq -- '--- PASS: TestE2E_TmuxSentinel ' "$output"; then
  echo "tmux e2e sentinel test did not pass" >&2
  validation_rc=1
fi
pass_count="$(grep -c '^--- PASS:' "$output" || true)"
case "$pass_count" in ''|*[!0-9]*) pass_count=0 ;; esac
if [ "$pass_count" -le 0 ]; then
  echo "e2e test output reported no passing tests" >&2
  validation_rc=1
else
  echo "CMDK_E2E_TEST_COUNT=$pass_count"
fi
if [ $test_rc -ne 0 ]; then exit $test_rc; fi
exit $validation_rc
'''

[tasks.lint]
description = "Run static analysis."
run = "golangci-lint run ./..."

[tasks.lint-fix]
description = "Run static analysis with --fix."
run = "golangci-lint run --fix ./..."

[tasks.lint-markdown]
description = "Lint tracked Markdown using the shared Markdown rules."
run = "git ls-files -z -- '*.md' '*.markdown' | xargs -0 markdownlint-cli2"

[tasks.fmt]
description = "Format Go source files."
run = "golangci-lint fmt"

[tasks.fmt-check]
description = "Verify formatting without changing files."
run = "golangci-lint fmt --diff"

[tasks.tidy]
description = "Apply go mod tidy."
run = "go mod tidy"

[tasks.tidy-check]
description = "Verify go.mod and go.sum are tidy without changing them."
run = "go mod tidy -diff"

[tasks.version-check]
description = "Verify the built binary reports the injected version."
depends = ["build"]
run = '''
version="$(git describe --tags --dirty --always 2>/dev/null || printf 'unknown')"
case "$version" in
  unknown|n/a|"") echo "degenerate version identity: '$version'"; exit 1;;
esac
out="$(build/cmdk --version)"
if [ "$out" != "cmdk version $version" ]; then
  echo "version mismatch: got '$out', want 'cmdk version $version'"
  exit 1
fi
'''

[tasks.vuln]
description = "Check dependencies and reachable code for known vulnerabilities."
run = "govulncheck ./..."

# check is read-only: it must leave the tracked tree unchanged and create nothing outside ignored paths. CI asserts a clean checkout before and after it. Add report-only tasks here; fixers (fmt, lint-fix, tidy) stay out.
[tasks.check]
description = "Run the complete local verification contract."
depends = ["fmt-check", "tidy-check", "lint", "lint-markdown", "test", "version-check", "vuln"]

[tasks.clean]
description = "Remove build artifacts, coverage files, and the Go test cache."
run = [
  "rm -rf build out dist coverage.out coverage.html *.coverprofile",
  "go clean -testcache",
]

[tasks.gen-icons]
description = "Regenerate icon entries from Nerd Fonts glyphnames.json."
run = "go run ./internal/icon/gen"

[tasks.test-gen-icons]
description = "Run the icon generator tests uncached with the race detector."
run = "go test -count=1 -race ./internal/icon/gen"
